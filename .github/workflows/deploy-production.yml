name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: 'Type "deploy" to confirm production deployment'
        required: true
        default: ''

jobs:
  validate-input:
    runs-on: ubuntu-latest
    steps:
    - name: Validate deployment confirmation
      run: |
        if [ "${{ github.event.inputs.confirm_deployment }}" != "deploy" ]; then
          echo "Deployment not confirmed. Please type 'deploy' to proceed."
          exit 1
        fi

  test:
    needs: validate-input
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run type check
      run: npm run type-check
    
    - name: Run linting
      run: npm run lint
    
    - name: Run tests
      run: npm run test -- --run
    
    - name: Build application
      run: npm run build

  deploy-production:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - name: Deploy to Production Environment
      run: |
        curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_PROD }}" \
          -H "Content-Type: application/json" \
          -d '{"clear_cache": true}'
    
    - name: Wait for deployment
      run: sleep 60
    
    - name: Health check
      run: |
        curl -f "https://groupifi.us/health" || exit 1
    
    - name: Notify deployment success
      run: |
        echo "✅ Production deployment successful!"
        echo "🌐 Application available at: https://groupifi.us"